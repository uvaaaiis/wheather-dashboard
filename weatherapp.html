<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weatherapp.css">
</head>
<body>
    
    
    <div class="container">

        <div class="theme-toggle">
            <h1 class="app">🌦️ Wheather Dashboard</h1>
            <button id="themeBtn">🌙 Dark</button>
        </div>

        <div class="all">

        <div class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name..." />
            <button id="searchBtn">Search</button>
        </div>


        <div id="weatherCard" class="weather-card" style="display: none;"></div>


        <div id="errorMsg" class="error" style="display: none;"></div>


        <div class="favorites-section">
            <div class="Favorites">
                <button id="favoritesbtn">Favorites</button>
                <div>
                    <button id="add">ADD</button>
                    <button id="remove">REMOVE</button>
                </div>
            </div>
            <div id="favoritesList" style="display: none;"></div>
        </div>

        </div>

    </div>


    <script src="weatherapp.js"></script>

</body>
</html>
